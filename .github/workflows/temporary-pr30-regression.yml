name: Temporary PR30 Regression Validation
on:
  pull_request:
    branches: [master]
jobs:
  formatted-files:
    if: github.head_ref == 'fix/p1-shutdown-compartment-20261023'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Format changed runtime sources and print snapshots
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check clang-format==19.1.5
          clang-format -i WeaselTSF/Compartment.cpp WeaselTSF/WeaselTSF.cpp WeaselTSF/WeaselTSF.h WeaselIPCServer/WeaselServerImpl.cpp
          git diff --name-only | while IFS= read -r file; do
            printf 'FORMAT_START:%s\n' "$file"
            base64 -w0 -- "$file"
            printf '\nFORMAT_END\n'
          done
  independent-policy:
    if: github.head_ref == 'fix/p1-shutdown-compartment-20261023'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Verify new and inherited regression policies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\test\TestFirstKeyWakeupPolicy.ps1
          .\test\TestKeyboardCompartmentPolicy.ps1
          .\test\TestServerShutdownPolicy.ps1
          .\test\TestCandidatePanelLifetimePolicy.ps1
          .\test\TestRuntimeHardeningPolicy.ps1
          .\test\TestResourcePolicy.ps1
          python .\test\TestInstaller\test_install_result.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer policy tests failed' }
  tsf-build:
    if: github.head_ref == 'fix/p1-shutdown-compartment-20261023'
    runs-on: windows-2022
    env:
      SDKVER: 10.0.19041.0
      boost_version: 1.92.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_92_0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: ${{ env.SDKVER }}
      - uses: actions/cache/restore@v4
        id: boost
        with:
          path: ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-b2v2
      - name: Install Boost when cache unavailable
        if: steps.boost.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\install_boost.bat
          if ($LASTEXITCODE -ne 0) { throw 'Boost setup failed' }
      - uses: xmake-io/github-action-setup-xmake@v1
      - name: Build WeaselTSF and WeaselServer
        shell: pwsh
        run: |
          xmake f -c -a x64 -m debug --vs=2022 --vs_toolset=14.3 -y
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
          xmake -v WeaselTSF
          if ($LASTEXITCODE -ne 0) { throw 'WeaselTSF failed' }
          xmake -v WeaselServer
          if ($LASTEXITCODE -ne 0) { throw 'WeaselServer failed' }
