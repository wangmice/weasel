name: CI

on:
  push:
    branches:
      - master
      - 'release/**'
    tags:
      - '[0-9]+.*'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v7

      - name: Install clang-format 19.1.5
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          python -m pip install --disable-pip-version-check clang-format==19.1.5
          clang-format --version

      - name: Code style lint
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: ./clang-format.sh -i

  policy:
    needs: lint
    runs-on: windows-2022
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure policy environment
        shell: pwsh
        run: |
          Copy-Item .\env.vs2022.bat .\env.bat -Force

      - name: Run static regression policies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          .\test\check-tsf-host-safety.ps1
          .\test\TestBuildEnvPolicy.ps1
          .\test\TestReleaseMetadataPolicy.ps1
          .\test\TestXmakeToolchainPolicy.ps1
          .\test\TestXmakeTargetLinkFlagsPolicy.ps1
          .\test\TestRuntimeHardeningPolicy.ps1
          .\test\TestBackgroundAndDeployerPolicy.ps1
          .\test\TestRestartRollbackRegressionPolicy.ps1
          .\test\TestRemainingRuntimePolicy.ps1
          .\test\TestFirstKeyWakeupPolicy.ps1
          .\test\TestKeyboardCompartmentPolicy.ps1
          .\test\TestCandidatePanelLifetimePolicy.ps1
          .\test\TestPipeDeadlinePolicy.ps1
          .\test\TestSessionLifecycleBuildPolicy.ps1
          .\test\TestSetupTransactionPolicy.ps1
          .\test\TestFinalTransactionPolicy.ps1
          .\test\TestResourcePolicy.ps1
          python .\test\TestInstaller\test_install_result.py
          if ($LASTEXITCODE -ne 0) { throw 'installer rollback tests failed' }

  xmake-preflight:
    needs: policy
    runs-on: windows-2022
    env:
      SDKVER: 10.0.19041.0
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: ${{ env.SDKVER }}

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Validate xmake configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:BOOST_ROOT = Join-Path $env:RUNNER_TEMP 'weasel-preflight-boost'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:BOOST_ROOT 'boost') | Out-Null
          Set-Content -LiteralPath (Join-Path $env:BOOST_ROOT 'boost\version.hpp') -Value '#pragma once'
          xmake f -c -a x64 -m debug --vs=2022 --vs_toolset=14.3 -y
          if ($LASTEXITCODE -ne 0) { throw 'xmake preflight configuration failed' }

  build:
    needs: xmake-preflight
    permissions:
      contents: write
    runs-on: windows-2022
    env:
      boost_version: 1.92.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_92_0
      SDKVER: 10.0.19041.0
    strategy:
      fail-fast: false
      matrix:
        variant: [msbuild, xmake]
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Configure build environment
        shell: bash
        run: |
          cp env.vs2022.bat env.bat
          echo git_ref_name="$(git describe --always)" >> $GITHUB_ENV

      - name: Validate release version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content .\VERSION -Raw).Trim()
          if ($version -ne '${{ github.ref_name }}') {
            throw "release tag ${{ github.ref_name }} does not match VERSION $version"
          }
          foreach ($appcast in @('.\update\appcast.xml', '.\update\testing-appcast.xml')) {
            $content = Get-Content $appcast -Raw
            $expectedUrl = "https://github.com/${{ github.repository }}/releases/download/$version/weasel-$version.0-installer.exe"
            if ($content -notmatch [regex]::Escape("sparkle:version=`"$version`"")) {
              throw "$appcast does not advertise version $version"
            }
            if ($content -notmatch [regex]::Escape($expectedUrl)) {
              throw "$appcast does not point at $expectedUrl"
            }
          }

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}-b2v2

      - name: Install Boost source
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: ./install_boost.bat

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          sdk: ${{ env.SDKVER }}

      - name: Validate Boost source, B2, and staged libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat boost arm64
          if ($LASTEXITCODE -ne 0) { throw 'Boost validation/build failed' }

      # bundled winsparkle v0.9.2 to disable auto open ReleaseNoteUrl in default browser
      - name: cache bundled winsparkle
        id: cache-winsparkle
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\x64\Release\WinSparkle.lib
            ${{ github.workspace }}\winsparkle\Release\WinSparkle.dll
            ${{ github.workspace }}\winsparkle\Release\WinSparkle.lib
          key: ${{ runner.os }}-winsparkle-v0.9.2-bundled
          restore-keys: |
            winsparkle-v0.9.2-bundled

      - name: Build bundled winsparkle
        if: steps.cache-winsparkle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path winsparkle) { Remove-Item -Recurse -Force winsparkle }
          git clone https://github.com/vslavik/winsparkle.git -b v0.9.2 --depth 1
          cd winsparkle
          git submodule update --init --recursive
          copy ..\bundled_winsparkle.patch .
          git apply bundled_winsparkle.patch
          nuget restore
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=x64 WinSparkle.sln
          msbuild -m -t:Build -p:Configuration=Release -p:Platform=Win32 WinSparkle.sln

      - name: Install WinSparkle files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          copy .\winsparkle\x64\Release\WinSparkle.dll .\output\
          copy .\winsparkle\x64\Release\WinSparkle.lib .\lib64\
          copy .\winsparkle\Release\WinSparkle.dll .\output\Win32\
          copy .\winsparkle\Release\WinSparkle.lib .\lib\

      - name: Get Rime files
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\get-rime.ps1 -use dev

      - name: Build data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat data

      - name: Setup xmake
        if: matrix.variant == 'xmake'
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Build Weasel
        shell: pwsh
        id: build_weasel
        env:
          RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.variant }}' -eq 'msbuild') {
            .\build.bat arm64 installer
          } else {
            .\xbuild.bat arm64 installer
          }

      - name: Run TSF command and composition regressions
        if: matrix.variant == 'xmake'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          xmake f -c -a x64 -m debug --vs=2022 --vs_toolset=14.3 -y
          if ($LASTEXITCODE -ne 0) { throw 'TSF regression configuration failed' }
          xmake build -y TestServerCommands
          if ($LASTEXITCODE -ne 0) { throw 'TSF regression build failed' }
          xmake run TestServerCommands
          if ($LASTEXITCODE -ne 0) { throw 'TSF command/composition regressions failed' }

      - name: Compress Debug Symbols
        if: matrix.variant == 'msbuild'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          output\7z.exe a -t7z "./output/archives/debug_symbols.7z" "output/*.pdb" -r

      - name: Upload artifacts
        if: matrix.variant == 'msbuild'
        uses: actions/upload-artifact@v7
        with:
          name: weasel-artifact-${{ env.git_ref_name }}
          if-no-files-found: error
          path: |
            .\output\archives\weasel*.exe
            .\output\archives\debug_symbols.7z

      - name: Extract changelog
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.variant == 'msbuild' }}
        shell: pwsh
        run: .\extract_changelog.ps1

      - name: Create Nightly release
        if: ${{ github.ref == 'refs/heads/master' && matrix.variant == 'msbuild' }}
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: "Nightly Build"
          files: |
            ./output/archives/weasel*.exe
            ./output/archives/debug_symbols.7z

      - name: Release (stable)
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.variant == 'msbuild' }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ./output/archives/weasel*.exe
            ./output/archives/debug_symbols.7z
          body_path: ${{ github.workspace }}/RELEASE_CHANGELOG.md
